# https://www.updatecli.io/docs/core/target/
## netatalk.yaml
name: Update Netatalk

x-changedif: &shared-changedif
  kind: shell
  spec:
    command: test "{{ source "lpkImageUrl" }}" "==" "{{ source "copyImageUrl" }}"

scms:
  default:
    kind: "github"
    spec:
      user: "PBK-B"
      owner: "PBK-B"
      repository: "lzc-netatalk3"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      username: 'updatecli'
      email: "updatecli@pbk6.cn"
      branch: master
      commitmessage:
        type: "chore"
        scope: "(deps)"

sources:
  nodeVersion:
    name: "Get Node.js version"
    kind: "shell"
    spec:
      command: |
        node --version
        npm --version
        npx --version

  checkPackageVersion:
    name: "Check package version using Node.js"
    kind: "shell"
    spec:
      command: |
        # 使用 Node.js 脚本检查版本
        node -e "console.log(require('./package.json').version)" || echo "No package.json"

  netatalkVersion:
    name: Get the latest netatalk/netatalk version
    kind: dockerimage
    disablesourceinput: true
    spec:
      image: netatalk/netatalk
      versionfilter: 
        kind: semver
        pattern: '*'
  copyImageUrl:
    kind: shell
    sourceid: netatalkVersion
    spec:
      command: npx -y @lazycatcloud/lzc-cli appstore copy-image "netatalk/netatalk:{{ source "netatalkVersion" }}" --trace-level=quiet
      environments:
        - name: LZC_CLI_TOKEN
          value: {{ requiredEnv "LZC_CLI_TOKEN" }}
  lpkImageUrl:
    name: Get LPK Image URL
    scmid: default
    kind: yaml
    spec:
      file: lzc-manifest.yml
      key: $.services.netatalk.image
  currentVersion:
    name: "Get current version"
    scmid: default
    kind: yaml
    transformers:
        - semverinc: patch # major / minor / patch
    spec:
      file: lzc-manifest.yml
      key: $.version



targets:
  updateImage:
    name: Bump netatalk/netatalk Docker Image Tag
    scmid: default
    kind: yaml
    sourceid: copyImageUrl
    spec:
      file: lzc-manifest.yml
      key: $.services.netatalk.image
      changedif: *shared-changedif

  updateImageCode:
    name: Bump netatalk/netatalk Docker Image Tag Code
    scmid: default
    kind: yaml
    sourceid: netatalkVersion
    spec:
      file: lzc-manifest.yml
      key: $.services.netatalk.mark
      quote: false
      changedif: *shared-changedif

  updateVersion:
    name: "Update version in manifest.yml"
    scmid: default
    kind: yaml
    dependson: ['updateImageCode']
    dependsonchange: true
    sourceid: currentVersion
    spec:
      file: lzc-manifest.yml
      key: $.version
      value: '{{ source "currentVersion" }}'

actions:
  default:
    title: Open a GitHub pull request with new Netatalk version
    kind: github/pullrequest
    scmid: default
    target:
      - updateVersion
    spec:
      automerge: true
      mergemethod: squash
      labels:
        - dependencies
