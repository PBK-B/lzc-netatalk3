name: BuildLPK

on:
  # Manually trigger BuildLPK via GitHub UI
  workflow_dispatch:
  # Trigger BuildLPK if a PullRequest is open targeting the main branch.
  pull_request:
    branches: [master, updatecli_**]

permissions:
  contents: "write"
  pull-requests: "write"

jobs:
  buildlpk:
    runs-on: "ubuntu-latest"
    env:
      GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      LZC_CLI_TOKEN: "${{ secrets.LZC_CLI_TOKEN }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}

      - name: Install LZC-CLI
        run: "npm install -g @lazycatcloud/lzc-cli && npx -y lzc-cli --version"

      - name: Cache LPK Releases
        id: cache-lpk-releases
        uses: actions/cache@v4
        env:
          cache-name: cache-lpk-releases
        with:
          path: "**/cloud.lazycat.app.netatalk-v**.lpk"
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/lzc-manifest.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-

      - name: Build LPK
        run: "npx -y lzc-cli project build"
